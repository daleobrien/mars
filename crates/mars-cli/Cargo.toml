[package]
name = "mars-cli"
description = "encmars / decmars / marsbench command-line front ends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mars-bench = { workspace = true }
mars-codec = { workspace = true }
mars-search = { workspace = true }
mars-core = { workspace = true }
mars-gpu = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }

# `encmars --human-adaptive` face detection is opt-in so the ordinary build never needs
# OpenCV (a heavy native dependency, installed via Homebrew/pkg-config) or ONNX Runtime.
# `rusty_scrfd` v2 dropped its re-exports, so the peer crates it exposes in its API must be
# depended on directly, at the exact versions its own manifest pins. Build with
# `cargo build -p mars-cli --features face-detect` to enable it.
rusty_scrfd = { version = "2.0.1", optional = true }
ort = { version = "=2.0.0-rc.13", features = ["ndarray"], optional = true }
opencv = { version = "0.100", optional = true }
ndarray = { version = "0.17", optional = true }

[features]
# Enables `mars_cli::human::detect_faces` and hence `encmars --human-adaptive`.
face-detect = ["dep:rusty_scrfd", "dep:ort", "dep:opencv", "dep:ndarray"]

[[bin]]
name = "marsbench"
path = "src/bin/marsbench.rs"

[[bin]]
name = "encmars"
path = "src/bin/encmars.rs"

[[bin]]
name = "decmars"
path = "src/bin/decmars.rs"

[lints]
workspace = true
