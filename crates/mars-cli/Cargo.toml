[package]
name = "mars-cli"
description = "encmars / decmars / marsbench command-line front ends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mars-bench = { workspace = true }
mars-codec = { workspace = true }
mars-search = { workspace = true }
mars-core = { workspace = true }
mars-gpu = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }

# `encmars --human-adaptive` face detection is opt-in. It needs only ONNX Runtime -- `ort`
# downloads a prebuilt library at build time, so no system package is required and there
# is no OpenCV dependency: `src/scrfd.rs` does the SCRFD preprocessing and decode directly
# against the model's tensors. Build with
# `cargo build -p mars-cli --features face-detect` to enable it.
ort = { version = "=2.0.0-rc.13", optional = true }
ndarray = { version = "0.17", optional = true }
# Writing the `--debug-regions` overlay. Already in the graph via `mars-core`.
image = { workspace = true, optional = true }

[features]
# Enables `mars_cli::scrfd::detect_faces` and hence `encmars --human-adaptive`.
face-detect = ["dep:ort", "dep:ndarray", "dep:image"]

[[bin]]
name = "marsbench"
path = "src/bin/marsbench.rs"

[[bin]]
name = "encmars"
path = "src/bin/encmars.rs"

[[bin]]
name = "decmars"
path = "src/bin/decmars.rs"

[lints]
workspace = true
