[workspace]
resolver = "2"
members = [
    "crates/mars-core",
    "crates/mars-codec",
    "crates/mars-bench",
    "crates/mars-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/dale/mars"
authors = ["The Mars 2 authors"]

[workspace.dependencies]
# Path dependencies carry an explicit version so `cargo deny check bans` does not see
# them as wildcards; a wildcard dependency is denied outright.
mars-core = { path = "crates/mars-core", version = "0.1.0" }
mars-codec = { path = "crates/mars-codec", version = "0.1.0" }
mars-bench = { path = "crates/mars-bench", version = "0.1.0" }

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
debug = 1
