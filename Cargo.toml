[workspace]
resolver = "2"
members = [
    "crates/mars-core",
    "crates/mars-codec",
    "crates/mars-search",
    "crates/mars-gpu",
    "crates/mars-bench",
    "crates/mars-cli",
    "crates/mars-entropy",
    "crates/mars-simd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/dale/mars"
authors = ["The Mars 2 authors"]

[workspace.dependencies]
# Path dependencies carry an explicit version so `cargo deny check bans` does not see
# them as wildcards; a wildcard dependency is denied outright.
mars-core = { path = "crates/mars-core", version = "0.1.0" }
mars-codec = { path = "crates/mars-codec", version = "0.1.0" }
mars-search = { path = "crates/mars-search", version = "0.1.0" }
mars-entropy = { path = "crates/mars-entropy", version = "0.1.0" }
mars-simd = { path = "crates/mars-simd", version = "0.1.0" }
mars-gpu = { path = "crates/mars-gpu", version = "0.1.0" }
mars-bench = { path = "crates/mars-bench", version = "0.1.0" }

anyhow = "1.0"
constriction = "0.5"
bytemuck = { version = "1.19", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
# Metal + WGSL only (§2.2: this project targets one machine, Apple Silicon). Default
# features pull in dx12/gles/vulkan/webgpu, and with them Apache-2.0-only crates
# (khronos_api, gl_generator, spirv, codespan-reporting) that `deny.toml`'s licence
# policy deliberately rejects (see that file's header comment) -- trimming to what this
# target actually needs avoids the conflict rather than widening the allow-list.
wgpu = { version = "30", default-features = false, features = ["std", "metal", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
debug = 1

# `cargo test` and `cargo build` use this profile. At the default opt-level 0 the
# exhaustive fractal search runs ~20-50x slower than release: `color_gate`'s full-image
# colour round trip alone measured ~23 minutes of wall time (13480s CPU) against 277s CPU
# in release. The gate recipes in the Justfile sidestep that by passing `--release`, but
# the plan's routine `cargo test --locked -p mars-codec` does not, so the tax hit every
# test run. opt-level 2 removes it while keeping dev-profile semantics (debug assertions
# and debuginfo still on). Deliberately not 3: this profile is also for debugging, and 2
# captures essentially all of the numeric win at a lower compile cost.
[profile.dev]
opt-level = 2
